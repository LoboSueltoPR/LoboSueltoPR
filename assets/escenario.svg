<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Lobo Suelto Records, en vivo desde Bahía Blanca">
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04060d"/><stop offset="1" stop-color="#0d1533"/></linearGradient>
<radialGradient id="piso" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#7DD3FC" stop-opacity=".25"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient>
<linearGradient id="h0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC" stop-opacity=".7"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></linearGradient><linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".7"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient><linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBBF24" stop-opacity=".7"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></linearGradient><linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC" stop-opacity=".7"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></linearGradient>
<filter id="brillo" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="marco"><rect width="900" height="300" rx="18"/></clipPath>
</defs>
<style>
.haz{transform-box:fill-box;transform-origin:50% 0;animation:barrido 6s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes barrido{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.foco{animation:titila 2.2s ease-in-out infinite}
@keyframes titila{0%,100%{opacity:.55}50%{opacity:1}}
.llama{transform-box:fill-box;transform-origin:50% 100%;animation:llama 1.1s ease-in-out infinite alternate}
@keyframes llama{from{transform:scale(.8,.75);opacity:.75}to{transform:scale(1.05,1.15);opacity:1}}
.titulo{animation:late 4s ease-in-out infinite}
@keyframes late{0%,100%{opacity:.88}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#marco)">
<rect width="900" height="300" fill="url(#fondo)"/>
<ellipse cx="450.0" cy="300" rx="495.00000000000006" ry="120" fill="url(#piso)"/>
<polygon class="haz" style="animation-duration:5.5s;animation-delay:0s" points="140,18 45,300 235,300" fill="url(#h0)"/><polygon class="haz" style="animation-duration:7s;animation-delay:-2s" points="340,18 245,300 435,300" fill="url(#h1)"/><polygon class="haz" style="animation-duration:6s;animation-delay:-4s" points="560,18 465,300 655,300" fill="url(#h2)"/><polygon class="haz" style="animation-duration:8s;animation-delay:-1s" points="760,18 665,300 855,300" fill="url(#h3)"/>
<rect width="900" height="18" fill="#141b33"/>
<rect x="126" y="10" width="28" height="14" rx="3" fill="#1e2747"/><circle class="foco" style="animation-delay:0s" cx="140" cy="22" r="6" fill="#7DD3FC"/><rect x="326" y="10" width="28" height="14" rx="3" fill="#1e2747"/><circle class="foco" style="animation-delay:-2s" cx="340" cy="22" r="6" fill="#A78BFA"/><rect x="546" y="10" width="28" height="14" rx="3" fill="#1e2747"/><circle class="foco" style="animation-delay:-4s" cx="560" cy="22" r="6" fill="#FBBF24"/><rect x="746" y="10" width="28" height="14" rx="3" fill="#1e2747"/><circle class="foco" style="animation-delay:-1s" cx="760" cy="22" r="6" fill="#7DD3FC"/>
<g class="titulo" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
<text x="450.0" y="138" font-size="62" font-weight="900" letter-spacing="5" fill="#E0F2FE" filter="url(#brillo)">LOBO SUELTO</text>
<text x="450.0" y="176" font-size="15" font-weight="700" letter-spacing="7" fill="#7DD3FC">RECORDS · EN VIVO DESDE BAHÍA BLANCA</text>
</g>
<g fill="#010208"><circle cx="-10" cy="274" r="18"/><rect x="-8" y="214" width="6" height="60" rx="3"/><circle cx="24" cy="284" r="18"/><circle cx="50" cy="278" r="15"/><circle cx="77" cy="275" r="18"/><circle cx="100" cy="270" r="14"/><circle cx="132" cy="279" r="13"/><circle cx="155" cy="278" r="13"/><circle cx="178" cy="284" r="15"/><circle cx="211" cy="272" r="18"/><circle cx="239" cy="281" r="15"/><rect x="234" y="238" width="6" height="43" rx="3"/><circle cx="272" cy="284" r="19"/><circle cx="302" cy="273" r="17"/><circle cx="324" cy="271" r="18"/><rect x="316" y="216" width="6" height="55" rx="3"/><circle cx="356" cy="282" r="15"/><circle cx="378" cy="282" r="18"/><circle cx="401" cy="278" r="17"/><circle cx="431" cy="272" r="16"/><rect x="425" y="212" width="6" height="60" rx="3"/><circle cx="459" cy="277" r="19"/><circle cx="487" cy="281" r="18"/><circle cx="516" cy="278" r="15"/><circle cx="546" cy="273" r="15"/><rect x="547" y="215" width="6" height="58" rx="3"/><circle cx="571" cy="279" r="18"/><circle cx="602" cy="273" r="13"/><circle cx="624" cy="283" r="15"/><circle cx="657" cy="273" r="15"/><circle cx="685" cy="277" r="18"/><circle cx="708" cy="278" r="19"/><circle cx="730" cy="270" r="14"/><circle cx="757" cy="284" r="16"/><circle cx="783" cy="284" r="14"/><circle cx="805" cy="278" r="14"/><circle cx="829" cy="281" r="16"/><circle cx="861" cy="270" r="14"/><rect x="852" y="222" width="6" height="48" rx="3"/><circle cx="887" cy="283" r="15"/><circle cx="910" cy="270" r="18"/></g>
